name: nurul-huda-local

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile.dev
  image: nurul-huda-dev:local
  init: true
  volumes:
    - ./frontend/app:/app/frontend/app:ro
    - ./frontend/public:/app/frontend/public:ro
    - ./frontend/worker:/app/frontend/worker:ro
    - ./frontend/scripts:/app/frontend/scripts:ro
    - ./frontend/tests:/app/frontend/tests:ro
    - ./frontend/vite.config.ts:/app/frontend/vite.config.ts:ro
    - ./frontend/next.config.ts:/app/frontend/next.config.ts:ro
    - ./backend/src:/app/backend/src:ro
    - ./backend/tests:/app/backend/tests:ro
    - ./backend/drizzle:/app/backend/drizzle
    - ./contracts:/app/contracts:ro
    - ./docker:/app/docker:ro
    - private_uploads_dev:/app/backend/uploads

x-database-env: &database-env
  POSTGRES_DB: ${POSTGRES_DB:-nurul_huda}
  POSTGRES_USER: nurul_huda
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD pada backend/.env}

services:
  postgres:
    image: postgres:17-alpine
    environment: *database-env
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nurul_huda -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    <<: *app
    environment:
      <<: *database-env
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4000
      FRONTEND_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /app/backend/uploads
      CHOKIDAR_USEPOLLING: "true"
    command: ["node", "docker/start-backend.mjs"]
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 45s
      retries: 20

  frontend:
    <<: *app
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      API_BASE_URL: http://backend:4000/api/v1
      DOCKER_DEV: "true"
      WRANGLER_SEND_METRICS: "false"
    command: ["npm", "run", "dev", "--workspace=@nurul-huda/frontend", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 20

  checks:
    <<: *app
    profiles: ["tools"]
    environment:
      NODE_ENV: test
    command: ["sh", "-c", "npm run check && npm run build --workspace=@nurul-huda/backend"]

volumes:
  postgres_dev_data:
  private_uploads_dev:

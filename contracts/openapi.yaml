        - Applications
      security:
        - { applicantSession: [] }
      x-implementation-status: planned
      x-roles:
        - applicant
      x-auth-flow-status: design-required
      x-owner: 7
      operationId: replaceOwnApplicationDocument
      summary: Pendaftar memperbaiki atau melengkapi berkasnya
      description: >-
        Server mengambil pendaftaran dari session. Izinkan slot Belum ada atau Perlu perbaikan;
        berkas Terverifikasi terkunci sampai admin meminta perbaikan. Setelah berhasil status
        Menunggu pemeriksaan; status penerimaan tidak berubah. Berlaku meskipun pendaftaran baru
        ditutup. Admin tetap satu-satunya pemeriksa. Simpan versi lama tanpa purge otomatis; file
        sementara gagal boleh dibersihkan. Rate limit, validasi signature dan maksimum 5 MiB tetap
        wajib.
      requestBody:
        required: true
        content:
          {
            multipart/form-data:
              {
                schema:
                  { $ref: "#/components/schemas/ApplicantDocumentReplacement" },
              },
          }
      responses:
        "200":
          {
            description: Berkas pengganti menunggu pemeriksaan,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/ApplicantDocument" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: File terlalu besar }
        "415": { description: Jenis file tidak didukung }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: nh_admin_session
    applicantSession:
      type: apiKey
      in: cookie
      name: nh_applicant_session
      description: >-
        Session privat terpisah dari session admin dan terikat ke satu pendaftaran. Mekanisme
        penerbitan/pemulihan akses harus ditetapkan anggota 9 sebelum endpoint koreksi diaktifkan.
        Nomor, NISN, tanggal lahir saja tidak boleh dianggap credential.
  parameters:
    ApplicationId:
      in: path
      name: applicationId
      required: true
      schema:
        type: string
        pattern: ^NH-[A-Z0-9-]+$
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: >-
        UUID per percobaan submit logis. Pakai ulang saat retry dengan isi sama. Server menyimpan
        hasil sukses 24 jam; isi berbeda memakai key sama menghasilkan 409. Key bukan izin akses dan
        tidak dimasukkan URL/log.
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Session tidak valid
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    ValidationError:
      description: Data tidak valid
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    RateLimited:
      description: Terlalu banyak permintaan
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    Forbidden:
      description: Izin ditolak, atau PPDB publik sedang ditutup
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    Conflict:
      description: Konflik data, versi, status, atau idempotency key
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    ServiceUnavailable:
      description: Penyimpanan sementara gagal; belum boleh menampilkan pendaftaran berhasil
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
    AdminSession:
      type: object
      required:
        - user
        - expiresAt
      properties:
        user:
          {
            type: object,
            required: [id, name, role],
            properties:
              {
                id: { type: string },
                name: { type: string },
                role: { type: string, enum: [super_admin, admin_ppdb, editor] },
              },
          }
        expiresAt: { type: string, format: date-time }
    RegistrationSource:
      type: string
      enum:
        - Website
        - Offline
    ApplicationStatus:
      type: string
      enum:
        - Verifikasi
        - Terverifikasi
        - Wawancara
        - Diterima
        - Ditolak
    DocumentKind:
      type: string
      enum:
        - skl
        - ijazah
        - kk
        - ktp
        - kip
        - akta
        - photo
      description: photo hanya untuk membaca metadata lama. Upload baru memakai UploadDocumentKind.
    StudentDocument:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - label
        - status
        - hasFile
        - receivedPhysically
      properties:
        id: { type: string, minLength: 1, maxLength: 120 }
        kind: { $ref: "#/components/schemas/DocumentKind" }
        label: { type: string, minLength: 1, maxLength: 120 }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        hasFile: { type: boolean }
        receivedPhysically: { type: boolean }
        fileName: { type: string, minLength: 1, maxLength: 255 }
        mimeType:
          { type: string, enum: [application/pdf, image/jpeg, image/png] }
        size: { type: integer, minimum: 1, maximum: 5242880 }
        uploadedAt: { type: string, format: date-time }
        reviewNote: { type: string, maxLength: 400 }
        reviewedAt: { type: [string, "null"], format: date-time }
        reviewedBy: { type: [string, "null"], maxLength: 120 }
      allOf:
        - {
            if: { properties: { hasFile: { const: true } } },
            then:
              {
                required: [fileName, mimeType, size, uploadedAt],
                properties:
                  {
                    fileName: { type: string, minLength: 1, maxLength: 255 },
                    mimeType:
                      {
                        type: string,
                        enum: [application/pdf, image/jpeg, image/png],
                      },
                    size: { type: integer, minimum: 1, maximum: 5242880 },
                    uploadedAt: { type: string, format: date-time },
                  },
              },
            else:
              {
                not:
                  {
                    anyOf:
                      [
                        {
                          required: [fileName],
                          properties:
                            {
                              fileName:
                                { type: string, minLength: 1, maxLength: 255 },
                            },
                        },
                        {
                          required: [mimeType],
                          properties:
                            {
                              mimeType:
                                {
                                  type: string,
                                  enum:
                                    [application/pdf, image/jpeg, image/png],
                                },
                            },
                        },
                        {
                          required: [size],
                          properties:
                            {
                              size:
                                { type: integer, minimum: 1, maximum: 5242880 },
                            },
                        },
                        {
                          required: [uploadedAt],
                          properties:
                            { uploadedAt: { type: string, format: date-time } },
                        },
                      ],
                  },
              },
          }
        - {
            if:
              {
                properties:
                  {
                    status:
                      {
                        enum:
                          [
                            Menunggu pemeriksaan,
                            Terverifikasi,
                            Perlu perbaikan,
                          ],
                      },
                  },
              },
            then:
              {
                anyOf:
                  [
                    { properties: { hasFile: { const: true } } },
                    { properties: { receivedPhysically: { const: true } } },
                  ],
              },
          }
        - {
            if: { properties: { status: { const: Belum ada } } },
            then:
              {
                properties:
                  {
                    hasFile: { const: false },
                    receivedPhysically: { const: false },
                  },
              },
          }
        - {
            if: { properties: { status: { const: Perlu perbaikan } } },
            then:
              {
                required: [reviewNote],
                properties:
                  {
                    reviewNote:
                      {
                        type: string,
                        minLength: 1,
                        maxLength: 400,
                        pattern: \S,
                      },
                  },
              },
          }
      description: >-
        Metadata privat, tanpa storageKey/path server/URL publik. Slot kosong boleh memiliki id
        internal stabil. Status review tidak mengubah status penerimaan.
    ApplicationCreate:
      type: object
      additionalProperties: false
      required:
        - studentName
        - nisn
        - originSchool
        - birthPlace
        - birthDate
        - gender
        - address
        - parentName
        - phone
        - email
      properties:
        studentName: { type: string, minLength: 2, maxLength: 120 }
        nisn: { type: string, pattern: "^[0-9]{10}$" }
        originSchool: { type: string, minLength: 2, maxLength: 160 }
        birthPlace: { type: string, minLength: 2, maxLength: 100 }
        birthDate: { type: string, format: date }
        gender: { type: string, enum: [Laki-laki, Perempuan] }
        address: { type: string, minLength: 1, maxLength: 600 }
        parentName: { type: string, minLength: 2, maxLength: 120 }
        parentOccupation: { type: string, maxLength: 120 }
        phone: { type: string, pattern: "^[+]?[0-9 ]{8,20}$" }
        email: { type: string, format: email, maxLength: 254 }
        extracurriculars:
          { $ref: "#/components/schemas/ExtracurricularSelections" }
      description: >-
        Data publik hanya identitas dan pilihan kegiatan. ID, nomor, source, status, waktu, dan
        hasil pemeriksaan ditentukan server.
    ApplicationUpdate:
      type: object
      additionalProperties: false
      properties:
        studentName: { type: string, minLength: 2, maxLength: 120 }
        nisn: { type: string, pattern: "^[0-9]{10}$" }
        originSchool: { type: string, minLength: 2, maxLength: 160 }
        birthPlace: { type: string, minLength: 2, maxLength: 100 }
        birthDate: { type: string, format: date }
        gender: { type: string, enum: [Laki-laki, Perempuan] }
        address: { type: string, minLength: 1, maxLength: 600 }
        parentName: { type: string, minLength: 2, maxLength: 120 }
        parentOccupation: { type: string, maxLength: 120 }
        phone: { type: string, pattern: "^[+]?[0-9 ]{8,20}$" }
        email: { type: string, format: email, maxLength: 254 }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        notes: { type: string, maxLength: 1000 }
        extracurriculars:
          { $ref: "#/components/schemas/ExtracurricularSelections" }
      minProperties: 1
      description: >-
        Allowlist perubahan admin. NISN, tanggal lahir, email, dan pilihan ekstrakurikuler tetap
        divalidasi. Transisi status di service; ID/source/waktu tidak dapat diedit.
    Application:
      type: object
      additionalProperties: false
      required:
        - studentName
        - nisn
        - originSchool
        - birthPlace
        - birthDate
        - gender
        - address
        - parentName
        - phone
        - email
        - id
        - source
        - status
        - submittedAt
        - documents
        - extracurriculars

openapi: 3.1.0
info:
  title: SMP Nurul Huda API
  version: 1.0.0
  description: Kontrak integrasi frontend dan backend; endpoint admin memakai session cookie HttpOnly.
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
servers:
  - url: http://localhost:4000/api/v1
    description: Backend lokal
tags:
  - { name: Auth, description: Login dan session admin }
  - { name: Applications, description: Pendaftaran dan dokumen siswa }
  - { name: Directory, description: Struktur organisasi dan tenaga pendidik }
  - { name: Content, description: "Artikel, agenda, dan pengaturan publik" }
  - { name: Communication, description: Pesan masuk dan newsletter }
security: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginAdmin
      summary: Login admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "204": { description: Login berhasil }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/session:
    get:
      tags: [Auth]
      operationId: getAdminSession
      summary: Validasi session admin
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Session aktif
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutAdmin
      summary: Hapus session admin
      security: [{ cookieSession: [] }]
      responses:
        "204": { description: Logout berhasil }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /applications:
    get:
      tags: [Applications]
      operationId: listApplications
      summary: Cari dan filter pendaftar
      security: [{ cookieSession: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - {
            in: query,
            name: source,
            schema: { $ref: "#/components/schemas/RegistrationSource" },
          }
        - {
            in: query,
            name: status,
            schema: { $ref: "#/components/schemas/ApplicationStatus" },
          }
        - { in: query, name: cursor, schema: { type: string } }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        "200":
          description: Daftar pendaftar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Applications]
      operationId: createPublicApplication
      summary: Kirim formulir pendaftaran publik
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationCreate" }
      responses:
        "201":
          description: Pendaftaran dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationReceipt" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /applications/{applicationId}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      tags: [Applications]
      operationId: getApplication
      summary: Ambil detail pendaftar
      security: [{ cookieSession: [] }]
      responses:
        "200":
          {
            description: Detail pendaftar,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Application" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Applications]
      operationId: updateApplication
      summary: Perbarui data atau status pendaftar
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationUpdate" }
      responses:
        "200":
          {
            description: Data diperbarui,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Application" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Applications]
      operationId: deleteApplication
      summary: Hapus pendaftar
      security: [{ cookieSession: [] }]
      responses:
        "204": { description: Pendaftar dihapus }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /applications/{applicationId}/documents:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [Applications]
      operationId: uploadApplicationDocument
      summary: Unggah dokumen pendaftar
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { $ref: "#/components/schemas/DocumentKind" }
                file: { type: string, format: binary }
      responses:
        "201":
          {
            description: Dokumen tersimpan,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/StudentDocument" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: Ukuran file terlalu besar }
        "415": { description: Jenis file tidak didukung }
        "422": { $ref: "#/components/responses/ValidationError" }

  /directory:
    get:
      tags: [Directory]
      operationId: getSchoolDirectory
      summary: Ambil struktur organisasi dan guru
      responses:
        "200":
          {
            description: Direktori sekolah,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SchoolDirectory" } },
              },
          }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      tags: [Directory]
      operationId: updateSchoolDirectory
      summary: Simpan struktur organisasi dan guru
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolDirectory" }
      responses:
        "200":
          {
            description: Direktori tersimpan,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SchoolDirectory" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /posts:
    get:
      tags: [Content]
      operationId: listPosts
      summary: Ambil artikel publik
      responses:
        "200":
          {
            description: Daftar artikel,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Post" },
                      },
                  },
              },
          }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Content]
      operationId: createPost
      summary: Buat artikel admin
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/PostInput" } },
          }
      responses:
        "201":
          {
            description: Artikel dibuat,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Post" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /posts/{postId}:
    parameters:
      - { in: path, name: postId, required: true, schema: { type: string } }
    patch:
      tags: [Content]
      operationId: updatePost
      summary: Perbarui artikel
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/PostInput" } },
          }
      responses:
        "200":
          {
            description: Artikel diperbarui,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Post" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Content]
      operationId: deletePost
      summary: Hapus artikel
      security: [{ cookieSession: [] }]
      responses:
        "204": { description: Artikel dihapus }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /agenda:
    get:
      tags: [Content]
      operationId: listAgenda
      summary: Ambil agenda sekolah
      responses:
        "200":
          {
            description: Daftar agenda,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Agenda" },
                      },
                  },
              },
          }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Content]
      operationId: createAgenda
      summary: Tambah agenda
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/AgendaInput" } },
          }
      responses:
        "201":
          {
            description: Agenda dibuat,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Agenda" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /agenda/{agendaId}:
    parameters:
      - { in: path, name: agendaId, required: true, schema: { type: string } }
    patch:
      tags: [Content]
      operationId: updateAgenda
      summary: Perbarui agenda
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/AgendaInput" } },
          }
      responses:
        "200":
          {
            description: Agenda diperbarui,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Agenda" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Content]
      operationId: deleteAgenda
      summary: Hapus agenda
      security: [{ cookieSession: [] }]
      responses:
        "204": { description: Agenda dihapus }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /messages:
    get:
      tags: [Communication]
      operationId: listMessages
      summary: Ambil pesan masuk
      security: [{ cookieSession: [] }]
      responses:
        "200":
          {
            description: Daftar pesan,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/ContactMessage" },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Communication]
      operationId: createMessage
      summary: Kirim pesan publik
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ContactMessageInput" } },
          }
      responses:
        "201": { description: Pesan diterima }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /messages/{messageId}:
    parameters:
      - { in: path, name: messageId, required: true, schema: { type: string } }
    patch:
      tags: [Communication]
      operationId: updateMessage
      summary: Ubah status pesan
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                { status: { type: string, enum: [Baru, Dibaca, Selesai] } }
      responses:
        "200":
          {
            description: Pesan diperbarui,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ContactMessage" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Communication]
      operationId: deleteMessage
      summary: Hapus pesan
      security: [{ cookieSession: [] }]
      responses:
        "204": { description: Pesan dihapus }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /newsletter-subscriptions:
    post:
      tags: [Communication]
      operationId: createNewsletterSubscription
      summary: Daftar newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                { email: { type: string, format: email, maxLength: 254 } }
      responses:
        "201": { description: Subscription tersimpan }
        "204": { description: Email sudah terdaftar }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /settings:
    get:
      tags: [Content]
      operationId: getSchoolSettings
      summary: Ambil pengaturan publik
      responses:
        "200":
          {
            description: Pengaturan sekolah,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SchoolSettings" } },
              },
          }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      tags: [Content]
      operationId: updateSchoolSettings
      summary: Perbarui pengaturan sekolah
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/SchoolSettings" } },
          }
      responses:
        "200":
          {
            description: Pengaturan diperbarui,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SchoolSettings" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    cookieSession: { type: apiKey, in: cookie, name: nh_admin_session }
  parameters:
    ApplicationId:
      in: path
      name: applicationId
      required: true
      schema: { type: string, pattern: "^NH-[A-Z0-9-]+$" }
  responses:
    Unauthorized:
      {
        description: Session tidak valid,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    NotFound:
      {
        description: Data tidak ditemukan,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    ValidationError:
      {
        description: Data tidak valid,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    RateLimited:
      description: Terlalu banyak permintaan
      headers: { Retry-After: { schema: { type: integer } } }
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
    AdminSession:
      type: object
      required: [user, expiresAt]
      properties:
        user:
          type: object
          required: [id, name, role]
          properties:
            id: { type: string }
            name: { type: string }
            role: { type: string, enum: [super_admin, admin_ppdb, editor] }
        expiresAt: { type: string, format: date-time }
    RegistrationSource: { type: string, enum: [Website, Offline] }
    ApplicationStatus:
      {
        type: string,
        enum: [Verifikasi, Terverifikasi, Wawancara, Diterima, Ditolak],
      }
    DocumentKind: { type: string, enum: [kk, akta, ijazah, kip, photo] }
    StudentDocument:
      type: object
      required: [id, kind, label, status]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/DocumentKind" }
        label: { type: string }
        status: { type: string, enum: [Terverifikasi, Diunggah, Belum ada] }
        fileName: { type: string }
        mimeType:
          { type: string, enum: [application/pdf, image/jpeg, image/png] }
        size: { type: integer, minimum: 1, maximum: 5242880 }
        uploadedAt: { type: string, format: date-time }
    ApplicationCreate:
      type: object
      additionalProperties: false
      required:
        [
          studentName,
          nisn,
          originSchool,
          birthPlace,
          birthDate,
          gender,
          address,
          parentName,
          phone,
          email,
          program,
        ]
      properties:
        studentName: { type: string, minLength: 2, maxLength: 120 }
        nisn: { type: string, pattern: "^[0-9]{10}$" }
        originSchool: { type: string, minLength: 2, maxLength: 160 }
        birthPlace: { type: string, minLength: 2, maxLength: 100 }
        birthDate: { type: string, format: date }
        gender: { type: string, enum: [Laki-laki, Perempuan] }
        address: { type: string, minLength: 10, maxLength: 500 }
        parentName: { type: string, minLength: 2, maxLength: 120 }
        parentOccupation: { type: string, maxLength: 120 }
        phone: { type: string, pattern: "^[0-9+() -]{8,20}$" }
        email: { type: string, format: email, maxLength: 254 }
        program: { type: string, minLength: 2, maxLength: 100 }
        notes: { type: string, maxLength: 1000 }
    ApplicationUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        notes: { type: string, maxLength: 1000 }
        studentName: { type: string, minLength: 2, maxLength: 120 }
        originSchool: { type: string, minLength: 2, maxLength: 160 }
        parentName: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, pattern: "^[0-9+() -]{8,20}$" }
        email: { type: string, format: email, maxLength: 254 }
    Application:
      allOf:
        - { $ref: "#/components/schemas/ApplicationCreate" }
        - type: object
          required: [id, source, status, submittedAt, documents]
          properties:
            id: { type: string }
            source: { $ref: "#/components/schemas/RegistrationSource" }
            status: { $ref: "#/components/schemas/ApplicationStatus" }
            submittedAt: { type: string, format: date-time }
            documents:
              {
                type: array,
                items: { $ref: "#/components/schemas/StudentDocument" },
              }
    ApplicationReceipt:
      type: object
      required: [id, status, submittedAt]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        submittedAt: { type: string, format: date-time }
    ApplicationPage:
      type: object
      required: [items]
      properties:
        items:
          { type: array, items: { $ref: "#/components/schemas/Application" } }
        nextCursor: { type: [string, "null"] }
    SchoolDirectory:
      type: object
      additionalProperties: false
      required: [leaders, teachers]
      properties:
        leaders:
          type: array
          maxItems: 100
          contains:
            {
              type: object,
              properties: { level: { const: principal } },
              required: [level],
            }
          maxContains: 1
          items: { $ref: "#/components/schemas/SchoolLeader" }
        teachers:
          {
            type: array,
            maxItems: 300,
            items: { $ref: "#/components/schemas/Teacher" },
          }
    SchoolLeader:
      type: object
      additionalProperties: false
      required: [id, name, role, initials, focus, tone, level, portraitIndex]
      properties:
        id: { type: string }
        name: { type: string, minLength: 2, maxLength: 120 }
        role: { type: string, minLength: 2, maxLength: 120 }
        initials: { type: string, minLength: 1, maxLength: 3 }
        focus: { type: string, minLength: 2, maxLength: 240 }
        tone: { type: string, maxLength: 30 }
        level: { type: string, enum: [principal, leadership, support] }
        portraitIndex: { type: integer, minimum: 0, maximum: 7 }
    Teacher:
      type: object
      additionalProperties: false
      required:
        [id, name, initials, subject, cluster, years, note, tone, portraitIndex]
      properties:
        id: { type: string }
        name: { type: string, minLength: 2, maxLength: 120 }
        initials: { type: string, minLength: 1, maxLength: 3 }
        subject: { type: string, minLength: 2, maxLength: 120 }
        cluster:
          { type: string, enum: [Sains, Bahasa, Sosial, Kreatif & Karakter] }
        years: { type: integer, minimum: 0, maximum: 60 }
        note: { type: string, minLength: 2, maxLength: 300 }
        tone: { type: string, maxLength: 30 }
        portraitIndex: { type: integer, minimum: 0, maximum: 7 }
    PostInput:
      type: object
      required: [title, slug, category, image, excerpt, content, author, status]
      properties:
        title: { type: string, minLength: 3, maxLength: 180 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        category: { type: string, maxLength: 60 }
        image: { type: string, maxLength: 500 }
        excerpt: { type: string, minLength: 10, maxLength: 220 }
        content:
          {
            type: array,
            minItems: 1,
            items: { type: string, minLength: 1, maxLength: 5000 },
          }
        author: { type: string, minLength: 2, maxLength: 120 }
        status: { type: string, enum: [Terbit, Draft] }
    Post:
      allOf:
        - { $ref: "#/components/schemas/PostInput" }
        - {
            type: object,
            required: [id, updatedAt],
            properties:
              {
                id: { type: string },
                updatedAt: { type: string, format: date-time },
              },
          }
    AgendaInput:
      type: object
      required: [title, date, time, location, type, completed]
      properties:
        title: { type: string, minLength: 2, maxLength: 160 }
        date: { type: string, format: date }
        time: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
        location: { type: string, minLength: 2, maxLength: 160 }
        type: { type: string, enum: [Akademik, PPDB, Kegiatan, Rapat] }
        completed: { type: boolean }
    Agenda:
      allOf:
        - { $ref: "#/components/schemas/AgendaInput" }
        - { type: object, required: [id], properties: { id: { type: string } } }
    ContactMessageInput:
      type: object
      additionalProperties: false
      required: [name, email, topic, message]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        topic: { type: string, minLength: 2, maxLength: 120 }
        message: { type: string, minLength: 10, maxLength: 3000 }
    ContactMessage:
      allOf:
        - { $ref: "#/components/schemas/ContactMessageInput" }
        - {
            type: object,
            required: [id, status, submittedAt],
            properties:
              {
                id: { type: string },
                status: { type: string, enum: [Baru, Dibaca, Selesai] },
                submittedAt: { type: string, format: date-time },
              },
          }
    SchoolSettings:
      type: object
      additionalProperties: false
      required:
        [
          schoolName,
          tagline,
          email,
          ppdbEmail,
          phone,
          whatsapp,
          address,
          academicYear,
          registrationOpen,
        ]
      properties:
        schoolName: { type: string, minLength: 2, maxLength: 120 }
        tagline: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email }
        ppdbEmail: { type: string, format: email }
        phone: { type: string, minLength: 8, maxLength: 30 }
        whatsapp: { type: string, minLength: 8, maxLength: 30 }
        address: { type: string, minLength: 10, maxLength: 500 }
        academicYear: { type: string, pattern: "^[0-9]{4}/[0-9]{4}$" }
        registrationOpen: { type: boolean }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        requestId: { type: string }
        errors:
          {
            type: object,
            additionalProperties: { type: array, items: { type: string } },
          }

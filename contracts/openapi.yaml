openapi: 3.1.0
info:
  title: SMP Nurul Huda API
  version: 1.2.0
  description: >-
    Kontrak target integrasi 15 Oktober 2026. Bukan daftar endpoint yang sudah berjalan. Auth
    memiliki fondasi; resource sekolah dan upload berikut adalah pekerjaan tim. Perubahan kontrak
    tidak menjalankan migration atau menambah backend. Endpoint admin wajib memeriksa session, role,
    dan proteksi CSRF. Revisi kebutuhan pengguna: berkas wajib dapat diatur, PIP/KIP opsional,
    jadwal manual, tanpa syarat usia/kelayakan tambahan, ekstrakurikuler multiselect opsional,
    koreksi mandiri pendaftar dengan verifikasi admin, tanpa penghapusan otomatis.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:4000/api/v1
    description: Backend lokal
tags:
  - name: Auth
    description: Login dan session admin
  - name: Applications
    description: Pendaftaran dan dokumen siswa
  - name: Directory
    description: Struktur organisasi dan tenaga pendidik
  - name: Content
    description: Artikel, agenda, dan pengaturan publik
  - name: Communication
    description: Pesan masuk dan newsletter
  - name: Catalog
    description: Prestasi dan ekstrakurikuler
  - name: Dashboard
    description: Ringkasan admin tanpa data pribadi
security: []
paths:
  /auth/login:
    post:
      tags:
        - Auth
      operationId: loginAdmin
      summary: Login admin
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/LoginRequest" } },
          }
      responses:
        "204": { description: Login berhasil }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
      x-implementation-status: foundation
      x-owner: 9
  /auth/session:
    get:
      tags:
        - Auth
      operationId: getAdminSession
      summary: Validasi session admin
      security:
        - { cookieSession: [] }
      responses:
        "200":
          {
            description: Session aktif,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/AdminSession" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-implementation-status: foundation
      x-owner: 9
      x-roles:
        - super_admin
        - admin_ppdb
        - editor
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: logoutAdmin
      summary: Hapus session admin
      security:
        - { cookieSession: [] }
      responses:
        "204": { description: Logout berhasil }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-implementation-status: foundation
      x-owner: 9
      x-roles:
        - super_admin
        - admin_ppdb
        - editor
  /applications:
    get:
      tags:
        - Applications
      operationId: listApplications
      summary: Cari dan filter pendaftar
      security:
        - { cookieSession: [] }
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - {
            in: query,
            name: source,
            schema: { $ref: "#/components/schemas/RegistrationSource" },
          }
        - {
            in: query,
            name: status,
            schema: { $ref: "#/components/schemas/ApplicationStatus" },
          }
        - { in: query, name: cursor, schema: { type: string } }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - {
            in: query,
            name: documents,
            schema: { type: string, enum: [Lengkap, Belum lengkap] },
            description: "Filter sebelum pagination berdasarkan snapshot documentRequirements setiap pendaftar. Status menunggu/terverifikasi dengan file atau bukti fisik; KIP opsional. Jika tidak ada jenis diwajibkan, tidak ada kekurangan berkas wajib.",
          }
      responses:
        "200":
          {
            description: Daftar pendaftar,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApplicationPage" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-implementation-status: planned
      x-owner: 6
      x-roles:
        - super_admin
        - admin_ppdb
    post:
      tags:
        - Applications
      operationId: createPublicApplication
      summary: Kirim formulir pendaftaran publik
      requestBody:
        required: true
        content:
          {
            multipart/form-data:
              {
                schema: { $ref: "#/components/schemas/ApplicationMultipart" },
                encoding: { data: { contentType: application/json } },
              },
          }
      responses:
        "201":
          {
            description: Pendaftaran dibuat,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/ApplicationReceipt" },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: Batas file/request terlampaui }
        "415": { description: Jenis file tidak didukung }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      description: >-
        Satu submit publik memuat data JSON dan berkas. Maksimum 6 file × 5 MiB; JSON maksimal 16
        KiB; total request maksimal 32 MiB. Validasi seluruh input dan kebijakan berkas terkini
        sebelum penerimaan; 201 hanya setelah metadata dan file tersimpan. Bersihkan file sementara
        saat gagal. Akses koreksi sesudah submit hanya melalui session pendaftar terautentikasi,
        bukan nomor pendaftaran saja. Terapkan rate limit, batas resource, dan deduplikasi retry.
      x-implementation-status: planned
      x-owner: 5
  /applications/{applicationId}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      tags:
        - Applications
      operationId: getApplication
      summary: Ambil detail pendaftar
      security:
        - { cookieSession: [] }
      responses:
        "200":
          {
            description: Detail pendaftar,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Application" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-implementation-status: planned
      x-owner: 6
      x-roles:
        - super_admin
        - admin_ppdb
    patch:
      tags:
        - Applications
      operationId: updateApplication
      summary: Perbarui data atau status pendaftar
      security:
        - { cookieSession: [] }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ApplicationUpdate" } },
          }
      responses:
        "200":
          {
            description: Data diperbarui,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Application" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
      x-implementation-status: planned
      x-owner: 6
      x-roles:
        - super_admin
        - admin_ppdb
  /applications/{applicationId}/documents:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags:
        - Applications
      operationId: uploadApplicationDocument
      summary: Unggah dokumen pendaftar
      security:
        - { cookieSession: [] }
      requestBody:
        required: true
        content:
          {
            multipart/form-data:
              {
                schema:
                  {
                    type: object,
                    required: [kind, file],
                    properties:
                      {
                        kind:
                          { $ref: "#/components/schemas/UploadDocumentKind" },
                        file:
                          {
                            type: string,
                            format: binary,
                            minLength: 1,
                            x-max-bytes: 5242880,
                          },
                      },
                    additionalProperties: false,
                  },
              },
          }
      responses:
        "201":
          {
            description: Dokumen tersimpan,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/StudentDocument" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: Ukuran file terlalu besar }
        "415": { description: Jenis file tidak didukung }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
      description: >-
        Upload atau ganti satu jenis berkas oleh admin. Maksimum 5 MiB/file. Validasi signature;
        simpan privat dengan nama acak. Penggantian mereset status ke Menunggu pemeriksaan dan
        mencatat audit; versi lama yang sudah tersimpan tetap diarsipkan tanpa purge otomatis.
      x-implementation-status: planned
      x-owner: 7
      x-roles:
        - super_admin
        - admin_ppdb
    get:
      tags:
        - Applications
      operationId: listApplicationDocuments
      summary: Daftar metadata berkas privat
      security:
        - { cookieSession: [] }
      responses:
        "200":
          {
            description: Berhasil,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/DocumentList" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-implementation-status: planned
      x-owner: 7
      x-roles:
        - super_admin
        - admin_ppdb
  /directory:
    get:
      tags:
        - Directory
      operationId: getSchoolDirectory
      summary: Ambil struktur organisasi dan guru
      responses:
        "200":
          {
            description: Direktori sekolah,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SchoolDirectory" } },
              },
          }
        "429": { $ref: "#/components/responses/RateLimited" }
      x-implementation-status: planned
      x-owner: 3
    put:
      tags:
        - Directory
      operationId: updateSchoolDirectory
      summary: Simpan struktur organisasi dan guru
      security:
        - { cookieSession: [] }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/SchoolDirectory" } },
          }
      responses:
        "200":
          {
            description: Direktori tersimpan,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SchoolDirectory" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
      x-implementation-status: planned
      x-owner: 3
      x-roles:
        - super_admin
        - editor
  /posts:
    get:
      tags:
        - Content
      operationId: listPosts
      summary: Ambil artikel publik
      responses:
        "200":
          {
            description: Daftar artikel,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Post" },
                      },
                  },
              },
          }
        "429": { $ref: "#/components/responses/RateLimited" }
      description: >-
        Hanya status Terbit. Metadata halaman, sitemap, dan berita beranda memakai sumber artikel
        terbit yang sama.
      x-implementation-status: planned
      x-owner: 4
    post:
      tags:
        - Content
      operationId: createPost
      summary: Buat artikel admin
      security:
        - { cookieSession: [] }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/PostInput" } },
          }
      responses:
        "201":
          {
            description: Artikel dibuat,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Post" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
      x-implementation-status: planned
      x-owner: 4
      x-roles:
        - super_admin
        - editor
  /posts/{postId}:
    parameters:
      - in: path
        name: postId
        required: true
        schema: { type: string }
    patch:
      tags:
        - Content
      operationId: updatePost
      summary: Perbarui artikel
      security:
        - { cookieSession: [] }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/PostInput" } },
          }
      responses:
        "200":
          {
            description: Artikel diperbarui,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Post" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-implementation-status: planned
      x-owner: 4
      x-roles:
        - super_admin
        - editor
    delete:
      tags:
        - Content
      operationId: deletePost
      summary: Hapus artikel
      security:
        - { cookieSession: [] }
      responses:
        "204": { description: Artikel dihapus }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-implementation-status: planned
      x-owner: 4
      x-roles:
        - super_admin
        - editor
  /agenda:
    get:
      tags:
        - Content
      operationId: listAgenda
      summary: Ambil agenda sekolah
      responses:
        "200":
          {
            description: Daftar agenda,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Agenda" },
                      },
                  },
              },
          }
        "429": { $ref: "#/components/responses/RateLimited" }
      description: >-
        Hanya visibility=Publik. Rapat/internal tidak otomatis terbuka. UI lama perlu kontrol
        visibilitas saat integrasi.
      x-implementation-status: implemented
      x-owner: 2
    post:
      tags:
        - Content
      operationId: createAgenda
      summary: Tambah agenda
      security:
        - { cookieSession: [] }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/AgendaInput" } },
          }
      responses:
        "201":
          {
            description: Agenda dibuat,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Agenda" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-implementation-status: implemented
      x-owner: 2
      x-roles:
        - super_admin
        - editor
  /agenda/{agendaId}:
    parameters:
      - in: path
        name: agendaId
        required: true
        schema: { type: string }
    patch:
      tags:
        - Content
      operationId: updateAgenda
      summary: Perbarui agenda
      security:
        - { cookieSession: [] }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/AgendaInput" } },
          }
      responses:
        "200":
          {
            description: Agenda diperbarui,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Agenda" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-implementation-status: implemented
      x-owner: 2
      x-roles:
        - super_admin
        - editor
    delete:
      tags:
        - Content
      operationId: deleteAgenda
      summary: Hapus agenda
      security:
        - { cookieSession: [] }
      responses:
        "204": { description: Agenda dihapus }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-implementation-status: implemented
      x-owner: 2
      x-roles:
        - super_admin
        - editor
  /messages:
    get:
      tags:
        - Communication
      operationId: listMessages
      summary: Ambil pesan masuk
      security:
        - { cookieSession: [] }
      responses:
        "200":
          {
            description: Daftar pesan,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/ContactMessage" },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-implementation-status: planned
      x-owner: 8
      x-roles:
        - super_admin
        - editor
    post:
      tags:
        - Communication
      operationId: createMessage
      summary: Kirim pesan publik
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ContactMessageInput" } },
          }
      responses:
        "201": { description: Pesan diterima }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
      x-implementation-status: planned
      x-owner: 8
  /messages/{messageId}:
    parameters:
      - in: path
        name: messageId
        required: true
        schema: { type: string }
    patch:
      tags:
        - Communication
      operationId: updateMessage
      summary: Ubah status pesan
      security:
        - { cookieSession: [] }
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [status],
                    properties:
                      {
                        status: { type: string, enum: [Baru, Dibaca, Selesai] },
                      },
                  },
              },
          }
      responses:
        "200":
          {
            description: Pesan diperbarui,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ContactMessage" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-implementation-status: planned
      x-owner: 8
      x-roles:
        - super_admin
        - editor
    delete:
      tags:
        - Communication
      operationId: deleteMessage
      summary: Hapus pesan
      security:
        - { cookieSession: [] }
      responses:
        "204": { description: Pesan dihapus }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-implementation-status: planned
      x-owner: 8
      x-roles:
        - super_admin
        - editor
  /newsletter-subscriptions:
    post:
      tags:
        - Communication
      operationId: createNewsletterSubscription
      summary: Daftar newsletter
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [email],
                    properties:
                      {
                        email: { type: string, format: email, maxLength: 254 },
                      },
                  },
              },
          }
      responses:
        "201": { description: Subscription tersimpan }
        "204": { description: Email sudah terdaftar }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
      x-implementation-status: planned
      x-owner: 8
      x-phase: later
  /settings:
    get:
      tags:
        - Content
      operationId: getSchoolSettings
      summary: Ambil pengaturan publik
      responses:
        "200":
          {
            description: Pengaturan sekolah,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SchoolSettings" } },
              },
          }
        "429": { $ref: "#/components/responses/RateLimited" }
      x-implementation-status: planned
      x-owner: 9
    put:
      tags:
        - Content
      operationId: updateSchoolSettings
      summary: Perbarui pengaturan sekolah
      security:
        - { cookieSession: [] }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/SchoolSettings" } },
          }
      responses:
        "200":
          {
            description: Pengaturan diperbarui,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SchoolSettings" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
      x-implementation-status: planned
      x-owner: 9
      x-roles:
        - super_admin
  /applications/offline:
    post:
      tags:
        - Applications
      operationId: createOfflineApplication
      summary: Catat pendaftaran offline oleh admin
      security:
        - { cookieSession: [] }
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/ApplicationOfflineCreate" },
              },
          }
      responses:
        "201":
          {
            description: Berhasil,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Application" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
      x-implementation-status: planned
      x-owner: 6
      x-roles:
        - super_admin
        - admin_ppdb
  /applications/{applicationId}/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - in: path
        name: documentId
        required: true
        schema: { type: string, minLength: 1, maxLength: 100 }
    patch:
      tags:
        - Applications
      operationId: reviewApplicationDocument
      summary: Periksa berkas dan simpan catatan
      security:
        - { cookieSession: [] }
      description: >-
        Server menetapkan reviewer dan waktu. Tolak review bila file maupun penerimaan fisik tidak
        ada; catatan wajib saat perlu perbaikan. Nomor dokumen harus milik applicationId yang sama.
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/DocumentReviewInput" } },
          }
      responses:
        "200":
          {
            description: Berhasil,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/StudentDocument" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
